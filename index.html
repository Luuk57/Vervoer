<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rittenlog, Planning & Dashboard</title>
  
  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  
  <!-- SheetJS voor Excel Export -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

  <style>
    :root {
      --primary: #0056b3;
      --primary-dark: #004090;
      --success: #28a745;
      --warning: #ffc107;
      --danger: #dc3545;
      --bg-color: #f4f6f9;
      --card-bg: #ffffff;
      --text-color: #333333;
      --border-color: #d1d5db;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
    body { background-color: var(--bg-color); color: var(--text-color); padding: 15px; }

    .container { max-width: 1200px; margin: 0 auto; background: var(--card-bg); padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); }
    
    h1 { color: var(--primary); margin-bottom: 20px; font-size: 1.5rem; border-bottom: 2px solid #eee; padding-bottom: 10px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }

    /* Navigatie tabs */
    .nav-tabs { display: flex; gap: 10px; margin-bottom: 20px; border-bottom: 1px solid #ddd; padding-bottom: 10px; flex-wrap: wrap; }
    .tab-btn { background: #e2e8f0; border: none; padding: 10px 18px; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 0.95rem; transition: background 0.2s; }
    .tab-btn.active { background: var(--primary); color: white; }

    .tab-content { display: none; }
    .tab-content.active { display: block; }

    /* Dashboard Grid */
    .dashboard-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 15px; margin-bottom: 25px; }
    .dash-card { background: #f8fafc; border: 1px solid var(--border-color); border-radius: 10px; padding: 20px; text-align: center; box-shadow: 0 2px 5px rgba(0,0,0,0.03); }
    .dash-card h4 { font-size: 0.9rem; color: #64748b; margin-bottom: 8px; text-transform: uppercase; }
    .dash-card .stat { font-size: 1.8rem; font-weight: bold; }
    .stat-green { color: var(--success); }
    .stat-orange { color: #d97706; }
    .stat-red { color: var(--danger); }

    .form-card { background: #f8fafc; border: 1px solid var(--border-color); padding: 20px; border-radius: 10px; margin-bottom: 25px; }
    .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 15px; margin-bottom: 15px; }
    .form-group { display: flex; flex-direction: column; }
    label { font-weight: bold; margin-bottom: 6px; font-size: 0.85rem; color: #1e293b; }
    input, select, textarea { padding: 10px; border: 1px solid var(--border-color); border-radius: 6px; font-size: 0.95rem; background: #fff; }
    textarea { resize: vertical; height: 40px; }

    .time-input-group { display: flex; gap: 8px; align-items: center; }
    .time-input-group input { flex: 1; }
    .btn-quick-start { background: var(--success); color: white; border: none; padding: 10px 14px; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 0.85rem; }
    .btn-quick-start:hover { background: #218838; }
    .btn-quick-stop { background: var(--danger); color: white; border: none; padding: 10px 14px; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 0.85rem; }
    .btn-quick-stop:hover { background: #c82333; }

    .btn { background: var(--primary); color: white; border: none; padding: 12px 20px; border-radius: 6px; cursor: pointer; font-size: 1rem; font-weight: bold; transition: background 0.2s; width: 100%; }
    .btn:hover { background: var(--primary-dark); }
    .btn-excel { background: #1f7344; }
    .btn-excel:hover { background: #15572b; }
    .btn-pdf { background: #d9534f; }
    .btn-pdf:hover { background: #c9302c; }
    .btn-danger { background: var(--danger); padding: 6px 10px; font-size: 0.8rem; width: auto; }
    .btn-danger:hover { background: #bd2130; }
    .btn-warning { background: var(--warning); color: #000; padding: 6px 10px; font-size: 0.8rem; width: auto; }
    .btn-warning:hover { background: #e0a800; }

    /* Badges */
    .badge { padding: 5px 10px; border-radius: 6px; font-weight: bold; color: white; display: inline-block; font-size: 0.85rem; }
    .bg-green { background-color: var(--success); }
    .bg-orange { background-color: #f59e0b; }
    .bg-red { background-color: var(--danger); }

    /* Tabellen */
    .table-container { overflow-x: auto; margin-top: 15px; }
    table { width: 100%; border-collapse: collapse; font-size: 0.85rem; min-width: 900px; }
    th, td { border: 1px solid #ddd; padding: 10px; text-align: left; }
    th { background: var(--primary); color: white; }
    tr:nth-child(even) { background: #f8fafc; }

    .actions-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; flex-wrap: wrap; gap: 10px; }
    .filter-bar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }

    @media print {
      body { background: white; padding: 0; }
      .container { box-shadow: none; padding: 0; max-width: 100%; }
      .nav-tabs, .form-card, .actions-bar, .filter-bar, .btn, button { display: none !important; }
      table { border: 1px solid #000; }
      th, td { border: 1px solid #000; color: #000; }
      th { background: #ddd !important; color: #000 !important; -webkit-print-color-adjust: exact; }
    }
  </style>

  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0056b3">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="apple-touch-icon" href="icon-192.png">
</head>
<body>

<div class="container">
  <h1>
    <span>Rittenlog, Planning & Dashboard</span>
    <span id="currentDateLabel" style="font-size: 0.9rem; font-weight: normal; color: #555;">Overzicht</span>
  </h1>

  <div class="nav-tabs">
    <button class="tab-btn active" onclick="switchTab('logTab', this)">Rittenlog & Dashboard</button>
    <button class="tab-btn" onclick="switchTab('planTab', this)">Ritten Inplannen</button>
  </div>

  <!-- TAB 1: RITTENLOG & DASHBOARD -->
  <div id="logTab" class="tab-content active">
    <!-- DASHBOARD PRESTATIES -->
    <div class="dashboard-grid">
      <div class="dash-card">
        <h4>Te Vroeg</h4>
        <div class="stat stat-orange" id="statEarly">0%</div>
      </div>
      <div class="dash-card">
        <h4>Op Tijd</h4>
        <div class="stat stat-green" id="statOnTime">0%</div>
      </div>
      <div class="dash-card">
        <h4>Te Laat</h4>
        <div class="stat stat-red" id="statLate">0%</div>
      </div>
      <div class="dash-card">
        <h4>Totaal Ritten</h4>
        <div class="stat" id="statTotal" style="color: var(--primary);">0</div>
      </div>
    </div>

    <!-- RITTEN FORMULIER -->
    <div class="form-card">
      <h3 id="formTitle" style="margin-bottom: 15px; color: var(--primary);">Nieuwe Rit Toevoegen</h3>
      <form onsubmit="handleRitSubmit(event)">
        <input type="hidden" id="editRitId" value="">
        <div class="form-grid">
          <div class="form-group">
            <label>Bedrijf</label>
            <select id="bedrijfSelect" required onchange="checkNewOption(this, 'Bedrijf')">
              <option value="">-- Kies bedrijf --</option>
            </select>
          </div>

          <div class="form-group">
            <label>Chauffeur</label>
            <select id="chauffeurSelect" required onchange="checkNewOption(this, 'Chauffeur')">
              <option value="">-- Kies chauffeur --</option>
            </select>
          </div>

          <div class="form-group">
            <label>Kenteken</label>
            <select id="kentekenSelect" required onchange="checkNewOption(this, 'Kenteken')">
              <option value="">-- Kies kenteken --</option>
            </select>
          </div>

          <div class="form-group">
            <label>Vanaf (Vertrek)</label>
            <select id="vanafSelect" required onchange="checkNewOption(this, 'Vanaf')">
              <option value="">-- Kies vertrekpunt --</option>
            </select>
          </div>

          <div class="form-group">
            <label>Naar (Aankomst)</label>
            <select id="naarSelect" required onchange="checkNewOption(this, 'Naar')">
              <option value="">-- Kies bestemming --</option>
            </select>
          </div>

          <div class="form-group">
            <label>Afspraak Datum & Tijd</label>
            <input type="datetime-local" id="afspraakInput" required>
          </div>

          <div class="form-group">
            <label>Start Datum & Tijd</label>
            <div class="time-input-group">
              <input type="datetime-local" id="startInput" required>
              <button type="button" class="btn-quick-start" onclick="setQuickTime('startInput')">Start</button>
            </div>
          </div>

          <div class="form-group">
            <label>Stop Datum & Tijd (Aankomst)</label>
            <div class="time-input-group">
              <input type="datetime-local" id="stopInput" required>
              <button type="button" class="btn-quick-stop" onclick="setQuickTime('stopInput')">Stop</button>
            </div>
          </div>
        </div>

        <div class="form-group" style="margin-bottom: 15px;">
          <label>Opmerkingen</label>
          <textarea id="opmerkingenInput" placeholder="Eventuele bijzonderheden..."></textarea>
        </div>
        <div style="display: flex; gap: 10px;">
          <button type="submit" class="btn" id="submitBtn">Rit Opslaan</button>
          <button type="button" class="btn" style="background: #6c757d; display: none;" id="cancelEditBtn" onclick="resetForm()">Annuleren</button>
        </div>
      </form>
    </div>

    <!-- ACTIES, FILTER & EXPORT -->
    <div class="actions-bar">
      <div class="filter-bar">
        <label for="periodSelect" style="font-size: 0.9rem; margin-bottom: 0;">Periode Weergave & Export:</label>
        <select id="periodSelect" onchange="loadRitten()" style="padding: 8px 12px; border-radius: 6px; border: 1px solid var(--border-color);">
          <option value="today">Vandaag</option>
          <option value="7days">Afgelopen 7 dagen</option>
          <option value="30days">Afgelopen 30 dagen</option>
          <option value="all">Alle ritten</option>
        </select>
      </div>
      <div style="display: flex; gap: 10px; flex-wrap: wrap;">
        <button class="btn btn-excel" style="width: auto;" onclick="exportToExcel()">Exporteer naar Excel (.xlsx)</button>
        <button class="btn btn-pdf" style="width: auto;" onclick="exportPDF()">Print / PDF</button>
      </div>
    </div>

    <div class="table-container">
      <table>
        <thead>
          <tr>
            <th>Bedrijf</th>
            <th>Chauffeur</th>
            <th>Kenteken</th>
            <th>Vanaf &rarr; Naar</th>
            <th>Afspraak</th>
            <th>Start</th>
            <th>Stop</th>
            <th>Prestatie</th>
            <th>Opmerkingen</th>
            <th>Acties</th>
          </tr>
        </thead>
        <tbody id="rittenTableBody">
          <tr><td colspan="10" style="text-align:center;">Geen ritten gevonden voor deze periode.</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <!-- TAB 2: RITTEN INPLANNEN -->
  <div id="planTab" class="tab-content">
    <div class="form-card">
      <h3 style="margin-bottom: 15px; color: var(--primary);">Herhalende Ritten Inplannen</h3>
      <form onsubmit="handlePlanSubmit(event)">
        <div class="form-grid">
          <div class="form-group">
            <label>Bedrijf</label>
            <select id="planBedrijfSelect" required>
              <option value="">-- Kies bedrijf --</option>
            </select>
          </div>
          <div class="form-group">
            <label>Chauffeur</label>
            <select id="planChauffeurSelect" required>
              <option value="">-- Kies chauffeur --</option>
            </select>
          </div>
          <div class="form-group">
            <label>Kenteken</label>
            <select id="planKentekenSelect" required>
              <option value="">-- Kies kenteken --</option>
            </select>
          </div>
          <div class="form-group">
            <label>Vanaf (Vertrek)</label>
            <select id="planVanafSelect" required>
              <option value="">-- Kies vertrekpunt --</option>
            </select>
          </div>
          <div class="form-group">
            <label>Naar (Aankomst)</label>
            <select id="planNaarSelect" required>
              <option value="">-- Kies bestemming --</option>
            </select>
          </div>
          <div class="form-group">
            <label>Tijd van de Afspraak (HH:MM)</label>
            <input type="time" id="planTijdAfspraak" required>
          </div>
          <div class="form-group">
            <label>Herhaling / Frequentie</label>
            <select id="planFrequentie" required>
              <option value="single">Bepaalde datum (eenmalig)</option>
              <option value="daily">Elke dag</option>
              <option value="alternate">Om de dag</option>
              <option value="mwf">ma - wo - vrij</option>
              <option value="tts">di - do - za</option>
            </select>
          </div>
          <div class="form-group">
            <label>Startdatum van de planning</label>
            <input type="date" id="planStartDatum" required>
          </div>
          <div class="form-group">
            <label>Eindpunt planning</label>
            <select id="planEindType" onchange="toggleEindType(this.value)" required>
              <option value="date">Tot specifieke einddatum</option>
              <option value="month">Voor de geldende maand</option>
            </select>
          </div>
          <div class="form-group" id="planEindDatumGroup">
            <label>Einddatum</label>
            <input type="date" id="planEindDatum">
          </div>
        </div>
        <button type="submit" class="btn">Ritten Reeks Inplannen</button>
      </form>
    </div>
  </div>

</div>

<script>
  // Firebase configuratie
  const firebaseConfig = {
    apiKey: "AIzaSyBWaKFaJ1sUhSvXqK2pOCSDwJ3eMqDJag8",
    authDomain: "dialysedbase.firebaseapp.com",
    projectId: "dialysedbase",
    storageBucket: "dialysedbase.firebasestorage.app",
    messagingSenderId: "36507381882",
    appId: "1:36507381882:web:6cf9725f87c963c51ccbc3"
  };

  firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();

  let rittenList = [];
  let dropdownOptions = {
    Bedrijf: [],
    Chauffeur: [],
    Kenteken: [],
    Vanaf: [],
    Naar: []
  };

  window.onload = function() {
    loadDropdownsAndRitten();
  };

  function switchTab(tabId, btn) {
    document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
    document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
    document.getElementById(tabId).classList.add('active');
    btn.classList.add('active');
  }

  function getLocalDateKey(date = new Date()) {
    return `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}-${String(date.getDate()).padStart(2, '0')}`;
  }

  function setQuickTime(inputId) {
    const now = new Date();
    const year = now.getFullYear();
    const month = String(now.getMonth() + 1).padStart(2, '0');
    const day = String(now.getDate()).padStart(2, '0');
    const hours = String(now.getHours()).padStart(2, '0');
    const minutes = String(now.getMinutes()).padStart(2, '0');
    
    document.getElementById(inputId).value = `${year}-${month}-${day}T${hours}:${minutes}`;
  }

  function loadDropdownsAndRitten() {
    db.collection('ritten_settings').doc('dropdowns').get().then(doc => {
      if (doc.exists) {
        dropdownOptions = doc.data();
      }
      updateAllDropdowns();
      loadRitten();
    }).catch(err => {
      console.log("Fout bij laden instellingen:", err);
      loadRitten();
    });
  }

  function updateAllDropdowns() {
    ['bedrijfSelect', 'planBedrijfSelect'].forEach(id => populateSelect(id, dropdownOptions.Bedrijf, 'Nieuw bedrijf toevoegen...'));
    ['chauffeurSelect', 'planChauffeurSelect'].forEach(id => populateSelect(id, dropdownOptions.Chauffeur, 'Nieuwe chauffeur toevoegen...'));
    ['kentekenSelect', 'planKentekenSelect'].forEach(id => populateSelect(id, dropdownOptions.Kenteken, 'Nieuw kenteken toevoegen...'));
    ['vanafSelect', 'planVanafSelect'].forEach(id => populateSelect(id, dropdownOptions.Vanaf, 'Nieuw vertrekpunt toevoegen...'));
    ['naarSelect', 'planNaarSelect'].forEach(id => populateSelect(id, dropdownOptions.Naar, 'Nieuwe bestemming toevoegen...'));
  }

  function populateSelect(selectId, items, promptText) {
    const select = document.getElementById(selectId);
    if (!select) return;
    const currentValue = select.value;
    select.innerHTML = `<option value="">-- Selecteer --</option>`;
    
    if (items) {
      items.sort().forEach(item => {
        const opt = document.createElement('option');
        opt.value = item;
        opt.textContent = item;
        select.appendChild(opt);
      });
    }

    const newOpt = document.createElement('option');
    newOpt.value = "ADD_NEW";
    newOpt.textContent = `+ ${promptText}`;
    select.appendChild(newOpt);

    if (currentValue) select.value = currentValue;
  }

  function checkNewOption(selectElement, category) {
    if (selectElement.value === "ADD_NEW") {
      let promptMsg = `Voer nieuwe waarde in voor ${category}:`;
      let inputVal = prompt(promptMsg);

      if (inputVal && inputVal.trim() !== "") {
        let formattedVal = inputVal.trim();
        if (category === 'Kenteken') {
          formattedVal = formatDutchLicensePlate(formattedVal);
        }

        if (!dropdownOptions[category]) dropdownOptions[category] = [];
        if (!dropdownOptions[category].includes(formattedVal)) {
          dropdownOptions[category].push(formattedVal);
          saveDropdownsToFirebase();
        }
        updateAllDropdowns();
        selectElement.value = formattedVal;
      } else {
        selectElement.value = "";
      }
    }
  }

  function formatDutchLicensePlate(plate) {
    let clean = plate.toUpperCase().replace(/[^A-Z0-9]/g, '');
    if (clean.length === 6) {
      if (/^[A-Z]{2}\d{2}[A-Z]{2}$/.test(clean)) return `${clean.substr(0,2)}-${clean.substr(2,2)}-${clean.substr(4,2)}`;
      if (/^\d{2}[A-Z]{2}\d{2}$/.test(clean)) return `${clean.substr(0,2)}-${clean.substr(2,2)}-${clean.substr(4,2)}`;
      if (/^[A-Z]{2}\d{2}\d{2}$/.test(clean)) return `${clean.substr(0,2)}-${clean.substr(2,2)}-${clean.substr(4,2)}`;
      if (/^\d{2}\d{2}[A-Z]{2}$/.test(clean)) return `${clean.substr(0,2)}-${clean.substr(2,2)}-${clean.substr(4,2)}`;
      if (/^\d{2}[A-Z]{3}\d{1}$/.test(clean)) return `${clean.substr(0,2)}-${clean.substr(2,3)}-${clean.substr(5,1)}`;
      if (/^\d{1}[A-Z]{3}\d{2}$/.test(clean)) return `${clean.substr(0,1)}-${clean.substr(1,3)}-${clean.substr(4,2)}`;
      if (/^[A-Z]{2}\d{3}[A-Z]{1}$/.test(clean)) return `${clean.substr(0,2)}-${clean.substr(2,3)}-${clean.substr(5,1)}`;
      if (/^[A-Z]{1}\d{3}[A-Z]{2}$/.test(clean)) return `${clean.substr(0,1)}-${clean.substr(1,3)}-${clean.substr(4,2)}`;
      if (/^[A-Z]{3}\d{2}[A-Z]{1}$/.test(clean)) return `${clean.substr(0,3)}-${clean.substr(3,2)}-${clean.substr(5,1)}`;
      if (/^[A-Z]{2}\d{3}[A-Z]{2}$/.test(clean)) return `${clean.substr(0,2)}-${clean.substr(2,3)}-${clean.substr(5,2)}`;
    }
    return clean;
  }

  function saveDropdownsToFirebase() {
    db.collection('ritten_settings').doc('dropdowns').set(dropdownOptions).catch(err => {
      console.log("Fout bij opslaan dropdowns:", err);
    });
  }

  function loadRitten() {
    const period = document.getElementById('periodSelect').value;
    db.collection('ritten_log').get().then(snapshot => {
      rittenList = [];
      const now = new Date();

      snapshot.forEach(doc => {
        let data = doc.data();
        let include = true;

        if (data.start && period !== 'all') {
          let startDateStr = data.start.split('T')[0];
          let todayStr = getLocalDateKey(now);

          if (period === 'today') {
            if (startDateStr !== todayStr) include = false;
          } else if (period === '7days' || period === '30days') {
            let daysCount = period === '7days' ? 7 : 30;
            let pastDate = new Date();
            pastDate.setDate(pastDate.getDate() - daysCount);
            let pastStr = getLocalDateKey(pastDate);

            if (startDateStr < pastStr || startDateStr > todayStr) include = false;
          }
        }

        if (include) {
          rittenList.push({ id: doc.id, ...data });
        }
      });

      rittenList.sort((a, b) => (b.start || '').localeCompare(a.start || ''));
      renderDashboardAndTable();
    }).catch(err => {
      console.log("Fout bij laden ritten:", err);
    });
  }

  function handleRitSubmit(event) {
    event.preventDefault();
    const editId = document.getElementById('editRitId').value;
    const rit = {
      bedrijf: document.getElementById('bedrijfSelect').value,
      chauffeur: document.getElementById('chauffeurSelect').value,
      kenteken: document.getElementById('kentekenSelect').value,
      vanaf: document.getElementById('vanafSelect').value,
      naar: document.getElementById('naarSelect').value,
      afspraak: document.getElementById('afspraakInput').value,
      start: document.getElementById('startInput').value,
      stop: document.getElementById('stopInput').value,
      opmerkingen: document.getElementById('opmerkingenInput').value,
      timestamp: firebase.firestore.FieldValue.serverTimestamp()
    };

    if (editId) {
      db.collection('ritten_log').doc(editId).update(rit).then(() => {
        resetForm();
        loadRitten();
      }).catch(err => alert("Fout bij bijwerken: " + err.message));
    } else {
      db.collection('ritten_log').add(rit).then(() => {
        resetForm();
        loadRitten();
      }).catch(err => alert("Fout bij opslaan rit: " + err.message));
    }
  }

  function editRit(id) {
    const rit = rittenList.find(r => r.id === id);
    if (!rit) return;

    document.getElementById('editRitId').value = rit.id;
    document.getElementById('bedrijfSelect').value = rit.bedrijf;
    document.getElementById('chauffeurSelect').value = rit.chauffeur;
    document.getElementById('kentekenSelect').value = rit.kenteken;
    document.getElementById('vanafSelect').value = rit.vanaf;
    document.getElementById('naarSelect').value = rit.naar;
    document.getElementById('afspraakInput').value = rit.afspraak;
    document.getElementById('startInput').value = rit.start;
    document.getElementById('stopInput').value = rit.stop;
    document.getElementById('opmerkingenInput').value = rit.opmerkingen || '';

    document.getElementById('formTitle').innerText = 'Rit Bewerken';
    document.getElementById('submitBtn').innerText = 'Bijwerken Opslaan';
    document.getElementById('cancelEditBtn').style.display = 'block';

    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function resetForm() {
    document.querySelector('#logTab form').reset();
    document.getElementById('editRitId').value = '';
    document.getElementById('formTitle').innerText = 'Nieuwe Rit Toevoegen';
    document.getElementById('submitBtn').innerText = 'Rit Opslaan';
    document.getElementById('cancelEditBtn').style.display = 'none';
  }

  function deleteRit(id) {
    if (confirm("Weet je zeker dat je deze rit wilt verwijderen?")) {
      db.collection('ritten_log').doc(id).delete().then(() => {
        loadRitten();
      });
    }
  }

  // Planning logica
  function toggleEindType(val) {
    document.getElementById('planEindDatumGroup').style.display = val === 'date' ? 'flex' : 'none';
  }

  function handlePlanSubmit(event) {
    event.preventDefault();
    const bedrijf = document.getElementById('planBedrijfSelect').value;
    const chauffeur = document.getElementById('planChauffeurSelect').value;
    const kenteken = document.getElementById('planKentekenSelect').value;
    const vanaf = document.getElementById('planVanafSelect').value;
    const naar = document.getElementById('planNaarSelect').value;
    const tijd = document.getElementById('planTijdAfspraak').value;
    const freq = document.getElementById('planFrequentie').value;
    const startStr = document.getElementById('planStartDatum').value;
    const eindType = document.getElementById('planEindType').value;

    if (!startStr || !tijd) return;

    let startDate = new Date(startStr);
    let endDate = new Date(startDate);

    if (eindType === 'date') {
      const endStr = document.getElementById('planEindDatum').value;
      if (!endStr) {
        alert("Vul een einddatum in.");
        return;
      }
      endDate = new Date(endStr);
    } else {
      // Geldende maand (laatste dag van de maand)
      endDate = new Date(startDate.getFullYear(), startDate.getMonth() + 1, 0);
    }

    let batch = db.batch();
    let curr = new Date(startDate);
    let count = 0;

    while (curr <= endDate) {
      let dayOfWeek = curr.getDay(); // 0 = zon, 1 = ma, ..., 6 = za
      let match = false;

      if (freq === 'single') {
        match = true;
      } else if (freq === 'daily') {
        match = true;
      } else if (freq === 'alternate') {
        let diffTime = Math.abs(curr - startDate);
        let diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
        if (diffDays % 2 === 0) match = true;
      } else if (freq === 'mwf') {
        if (dayOfWeek === 1 || dayOfWeek === 3 || dayOfWeek === 5) match = true;
      } else if (freq === 'tts') {
        if (dayOfWeek === 2 || dayOfWeek === 4 || dayOfWeek === 6) match = true;
      }

      if (match) {
        let dateKey = getLocalDateKey(curr);
        let afspraakVal = `${dateKey}T${tijd}`;

        let newRef = db.collection('ritten_log').doc();
        batch.set(newRef, {
          bedrijf, chauffeur, kenteken, vanaf, naar,
          afspraak: afspraakVal,
          start: afspraakVal, // Standaard gelijk gezet
          stop: afspraakVal,
          opmerkingen: 'Ingeplande rit',
          timestamp: firebase.firestore.FieldValue.serverTimestamp()
        });
        count++;
      }

      if (freq === 'single') break;
      curr.setDate(curr.getDate() + 1);
    }

    batch.commit().then(() => {
      alert(`Succesvol ${count} ritten ingepland!`);
      loadRitten();
      switchTab('logTab', document.querySelector('.nav-tabs button'));
    }).catch(err => {
      alert("Fout bij inplannen: " + err.message);
    });
  }

  function getPerformanceStatus(stopTime, afspraakTime) {
    const stop = new Date(stopTime).getTime();
    const afspraak = new Date(afspraakTime).getTime();
    const diffMins = (stop - afspraak) / (1000 * 60);

    if (diffMins < -5) {
      return { label: 'Te Vroeg', class: 'bg-orange', type: 'early' };
    } else if (diffMins > 5) {
      return { label: 'Te Laat', class: 'bg-red', type: 'late' };
    } else {
      return { label: 'Op Tijd', class: 'bg-green', type: 'ontime' };
    }
  }

  function renderDashboardAndTable() {
    const tbody = document.getElementById('rittenTableBody');
    if (!tbody) return;
    tbody.innerHTML = '';

    if (rittenList.length === 0) {
      tbody.innerHTML = '<tr><td colspan="10" style="text-align:center;">Geen ritten gevonden voor deze periode.</td></tr>';
      document.getElementById('statEarly').innerText = '0%';
      document.getElementById('statOnTime').innerText = '0%';
      document.getElementById('statLate').innerText = '0%';
      document.getElementById('statTotal').innerText = '0';
      return;
    }

    let countEarly = 0;
    let countOnTime = 0;
    let countLate = 0;

    rittenList.forEach(item => {
      const status = getPerformanceStatus(item.stop, item.afspraak);
      if (status.type === 'early') countEarly++;
      if (status.type === 'ontime') countOnTime++;
      if (status.type === 'late') countLate++;

      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td><b>${item.bedrijf}</b></td>
        <td>${item.chauffeur}</td>
        <td>${item.kenteken}</td>
        <td>${item.vanaf} &rarr; ${item.naar}</td>
        <td>${item.afspraak ? item.afspraak.replace('T', ' ') : '-'}</td>
        <td>${item.start ? item.start.replace('T', ' ') : '-'}</td>
        <td>${item.stop ? item.stop.replace('T', ' ') : '-'}</td>
        <td><span class="badge ${status.class}">${status.label}</span></td>
        <td>${item.opmerkingen || '-'}</td>
        <td>
          <div style="display: flex; gap: 5px;">
            <button class="btn btn-warning" onclick="editRit('${item.id}')">Bewerken</button>
            <button class="btn btn-danger" onclick="deleteRit('${item.id}')">Verwijderen</button>
          </div>
        </td>
      `;
      tbody.appendChild(tr);
    });

    const total = rittenList.length;
    document.getElementById('statEarly').innerText = `${Math.round((countEarly / total) * 100)}%`;
    document.getElementById('statOnTime').innerText = `${Math.round((countOnTime / total) * 100)}%`;
    document.getElementById('statLate').innerText = `${Math.round((countLate / total) * 100)}%`;
    document.getElementById('statTotal').innerText = total;
  }

  function exportToExcel() {
    if (rittenList.length === 0) {
      alert("Geen ritten om te exporteren voor deze periode.");
      return;
    }

    let excelData = rittenList.map(item => {
      const status = getPerformanceStatus(item.stop, item.afspraak);
      return {
        "Bedrijf": item.bedrijf,
        "Chauffeur": item.chauffeur,
        "Kenteken": item.kenteken,
        "Vanaf": item.vanaf,
        "Naar": item.naar,
        "Afspraak": item.afspraak ? item.afspraak.replace('T', ' ') : '',
        "Start": item.start ? item.start.replace('T', ' ') : '',
        "Stop": item.stop ? item.stop.replace('T', ' ') : '',
        "Prestatie": status.label,
        "Opmerkingen": item.opmerkingen
      };
    });

    let worksheet = XLSX.utils.json_to_sheet(excelData);
    let workbook = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(workbook, worksheet, "Rittenlog");
    
    const period = document.getElementById('periodSelect').value;
    XLSX.writeFile(workbook, `Rittenlog_${period}_${new Date().toISOString().slice(0,10)}.xlsx`);
  }

  function exportPDF() {
    if (rittenList.length === 0) {
      alert("Geen ritten om te printen voor deze periode.");
      return;
    }
    window.print();
  }
</script>
