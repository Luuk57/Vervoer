<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Vervoer Centrale Dashboard</title>

    <!-- Inline Web App Manifest (PWA) -->
    <link rel="manifest" href='data:application/manifest+json,{
        "name": "Vervoer Dashboard",
        "short_name": "VervoerDB",
        "start_url": "./index.html",
        "display": "standalone",
        "background_color": "#0078d7",
        "theme_color": "#0078d7",
        "icons": [{
            "src": "https://cdn-icons-png.flaticon.com/512/220/220212.png",
            "sizes": "192x192",
            "type": "image/png"
        }]
    }'>

    <!-- Opmaak (CSS) -->
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            height: 100vh;
            overflow: hidden;
            background: #0078d7 url('https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?auto=format&fit=crop&w=1920&q=80') center/cover no-repeat;
            display: flex;
            flex-direction: column;
        }

        /* Gecentreerd inlogscherm */
        .login-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.8);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            padding: 15px;
        }

        .login-box {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            padding: 30px;
            border-radius: 8px;
            width: 100%;
            max-width: 380px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .login-box h2 {
            margin-bottom: 10px;
            color: #333;
        }

        .login-box p {
            margin-bottom: 15px;
            font-size: 14px;
            color: #666;
        }

        .login-box input, .login-box select {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 16px;
        }

        .login-box button {
            width: 100%;
            padding: 12px;
            background: #0078d7;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .login-box button:hover {
            background: #005a9e;
        }

        /* Interface na inloggen */
        #app-container {
            flex: 1;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            overflow-y: auto;
            color: white;
        }

        .panel {
            background: rgba(255, 255, 255, 0.92);
            color: #333;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }

        .panel h3 {
            margin-bottom: 10px;
            color: #0078d7;
        }

        input[type="text"], textarea {
            width: 100%;
            padding: 10px;
            margin-bottom: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 14px;
        }

        button.action-btn {
            background: #107c41;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
        }

        button.action-btn:hover {
            background: #0b5a30;
        }

        /* TEGELS GRID VOOR DE CENTRALE */
        .tiles-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 15px;
            margin-top: 10px;
        }

        .car-tile {
            border: 2px solid #ccc;
            border-radius: 8px;
            padding: 15px;
            text-align: center;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: transform 0.2s;
            color: #333;
        }

        .car-tile:hover {
            transform: translateY(-3px);
            opacity: 0.9;
        }

        .car-tile h4 {
            font-size: 18px;
            margin-bottom: 5px;
        }

        .car-tile p {
            font-size: 13px;
        }

        /* Status kleuren voor de tegels */
        .tile-aangemeld { background: #dff6dd; border-color: #107c41; }
        .tile-bezet { background: #fde7e9; border-color: #d83b01; }
        .tile-pauze { background: #fff4ce; border-color: #ffb900; }
        .tile-afgemeld { background: #f3f2f1; border-color: #8a8886; }

        /* KNIPPEREffect ALLEEN bij een nieuw bericht */
        @keyframes knipperAnim {
            0% { background-color: #ff0000; border-color: #fff; color: white; }
            50% { background-color: #fff4ce; border-color: #ffb900; color: #333; }
            100% { background-color: #ff0000; border-color: #fff; color: white; }
        }

        .car-tile.knipperen {
            animation: knipperAnim 0.8s infinite;
        }

        /* POPUP VENSTER (MODAL) */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.7);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10000;
            padding: 15px;
        }

        .modal-box {
            background: white;
            color: #333;
            padding: 20px;
            border-radius: 8px;
            width: 100%;
            max-width: 480px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            max-height: 90vh;
            display: flex;
            flex-direction: column;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .modal-header h3 {
            color: #0078d7;
            margin: 0;
        }

        .close-x-btn {
            background: #e81123;
            color: white;
            border: none;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .close-x-btn:hover {
            background: #a80710;
        }

        /* Chat historie box */
        .chat-history {
            background: #f9f9f9;
            border: 1px solid #ddd;
            border-radius: 6px;
            padding: 10px;
            height: 140px;
            overflow-y: auto;
            margin-bottom: 10px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .chat-msg {
            padding: 6px 10px;
            border-radius: 4px;
            font-size: 13px;
            max-width: 85%;
        }

        .chat-msg.centrale {
            background: #d0e1fd;
            align-self: flex-end;
            text-align: right;
        }

        .chat-msg.auto {
            background: #e2e2e2;
            align-self: flex-start;
        }

        /* Status tegels binnen de popup */
        .status-tiles-container {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
            margin: 8px 0;
        }

        .status-tile {
            padding: 8px;
            border: none;
            border-radius: 4px;
            font-weight: bold;
            color: white;
            cursor: pointer;
            text-align: center;
            font-size: 13px;
        }

        .status-aangemeld { background: #107c41; }
        .status-bezet { background: #d83b01; }
        .status-pauze { background: #ffb900; color: #333; }
        .status-afgemeld { background: #8a8886; }

        .status-tile:hover {
            opacity: 0.85;
        }

        .modal-bottom-btn {
            background: #444;
            color: white;
            border: none;
            padding: 10px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            width: 100%;
            margin-top: 10px;
        }

        .modal-bottom-btn:hover {
            background: #222;
        }

        ul { list-style: none; }
        ul li { background: #f0f4f8; padding: 8px; margin-bottom: 5px; border-radius: 4px; font-size: 13px; }
    </style>
</head>
<body>

    <!-- INLOGSCHERM -->
    <div id="login-screen" class="login-overlay">
        <div class="login-box">
            <h2>Vervoer Systeem</h2>
            <p>Wie ben je?</p>
            <input type="text" id="deviceNameInput" placeholder="Naam (bijv. Auto 1 of Centrale M10)">
            <select id="roleInput">
                <option value="Auto">Auto / Chauffeur (Client)</option>
                <option value="Centrale">Centrale (Lenovo M10)</option>
            </select>
            <button id="btnLogin">Inloggen</button>
        </div>
    </div>

    <!-- HOOFDSCHERM -->
    <div id="app-container" style="display: none;">
        <h2 id="welcomeHeader">Verbonden als: <span id="roleDisplay"></span></h2>

        <!-- VOOR AUTO'S / CHAUFFEURS -->
        <div id="auto-panel" class="panel" style="display: none;">
            <h3>🚗 Mijn Status & Acties</h3>
            <label>Meld je status:</label>
            <div class="status-tiles-container" style="margin-top: 5px; margin-bottom: 15px;">
                <button class="status-tile status-aangemeld" onclick="setMyStatus('Aangemeld')">Aangemeld</button>
                <button class="status-tile status-bezet" onclick="setMyStatus('Bezet')">Bezet</button>
                <button class="status-tile status-pauze" onclick="setMyStatus('Pauze')">Pauze</button>
                <button class="status-tile status-afgemeld" onclick="setMyStatus('Afgemeld')">Afgemeld</button>
            </div>

            <label>Stuur bericht naar Centrale:</label>
            <input type="text" id="autoStatusInput" placeholder="Typ je bericht...">
            <button class="action-btn" id="btnSendAutoStatus">Verstuur Bericht</button>
            
            <h3 style="margin-top: 15px;">📥 Berichten (Privé & Algemeen):</h3>
            <ul id="messagesForMe"><li>Nog geen berichten.</li></ul>
        </div>

        <!-- VOOR DE CENTRALE (LENOVO M10) -->
        <div id="centrale-panel" class="panel" style="display: none;">
            <h3>📡 Centrale Tegel-Overzicht (Klik op een auto voor chat & details)</h3>
            <div id="tilesGrid" class="tiles-grid">
                <p>Wachten op actieve auto's...</p>
            </div>

            <h3 style="margin-top: 25px;">📢 Algemeen Bericht Sturen naar Iedereen</h3>
            <textarea id="broadcastInput" placeholder="Typ een bericht voor alle auto's..."></textarea>
            <button class="action-btn" id="btnSendBroadcast">Verstuur naar Iedereen</button>
        </div>
    </div>

    <!-- POPUP VOOR DE CENTRALE (CHAT & DETAILS) -->
    <div id="centralModal" class="modal-overlay" style="display: none;">
        <div class="modal-box">
            <div class="modal-header">
                <h3 id="modalCarTitle">Auto Details</h3>
                <button class="close-x-btn" onclick="closeModal()">×</button>
            </div>
            
            <p style="font-size: 13px; margin-bottom: 8px;"><strong>Status:</strong> <span id="modalCarStatus">-</span></p>
            
            <div>
                <label style="font-size: 12px; font-weight: bold;">Chat Geschiedenis:</label>
                <div id="modalChatHistory" class="chat-history">
                    <!-- Berichten komen hier -->
                </div>
            </div>

            <div style="margin-bottom: 8px;">
                <input type="text" id="modalReplyInput" placeholder="Typ antwoord naar auto..." style="margin-bottom: 5px;">
                <button class="action-btn" onclick="sendReplyFromModal()">Verstuur Antwoord</button>
            </div>

            <div>
                <label style="font-size: 12px; font-weight: bold;">Stel status in voor deze auto:</label>
                <div class="status-tiles-container">
                    <button class="status-tile status-aangemeld" onclick="setCarStatusFromModal('Aangemeld')">Aangemeld</button>
                    <button class="status-tile status-bezet" onclick="setCarStatusFromModal('Bezet')">Bezet</button>
                    <button class="status-tile status-pauze" onclick="setCarStatusFromModal('Pauze')">Pauze</button>
                    <button class="status-tile status-afgemeld" onclick="setCarStatusFromModal('Afgemeld')">Afgemeld</button>
                </div>
            </div>

            <button class="modal-bottom-btn" onclick="closeModal()">Popup Sluiten</button>
        </div>
    </div>

    <!-- Firebase SDK (Compat v9) -->
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>

    <!-- App Logica -->
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDOj-x4BV4J1rkZ21Rl29D5kKnkTaswWVw",
            authDomain: "tabos-vocht.firebaseapp.com",
            databaseURL: "https://tabos-vocht-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "tabos-vocht",
            storageBucket: "tabos-vocht.appspot.com",
            messagingSenderId: "372380067963",
            appId: "1:372380067963:web:a9edec9815588e64b41ade"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let myName = "";
        let myRole = "";
        let selectedCarForModal = "";

        const loginScreen = document.getElementById('login-screen');
        const deviceNameInput = document.getElementById('deviceNameInput');
        const roleInput = document.getElementById('roleInput');
        const btnLogin = document.getElementById('btnLogin');
        const appContainer = document.getElementById('app-container');
        const roleDisplay = document.getElementById('roleDisplay');
        const autoPanel = document.getElementById('auto-panel');
        const centralePanel = document.getElementById('centrale-panel');

        btnLogin.addEventListener('click', () => {
            myName = deviceNameInput.value.trim();
            myRole = roleInput.value;

            if (myName === "") {
                alert("Vul een naam in.");
                return;
            }

            loginScreen.style.display = 'none';
            appContainer.style.display = 'flex';
            roleDisplay.innerText = `${myName} (${myRole})`;

            if (myRole === 'Centrale') {
                centralePanel.style.display = 'block';
                initCentrale();
            } else {
                autoPanel.style.display = 'block';
                initAuto();
            }
        });

        // --- FUNCTIES VOOR AUTO ---
        window.setMyStatus = function(statusText) {
            // Alleen status updaten, GEEN hasUnreadMessage op true zetten (dus niet knipperen)
            db.ref('cars/' + myName).update({
                name: myName,
                status: statusText,
                lastUpdate: new Date().toLocaleTimeString()
            });
            stuurChatBericht("Status gewijzigd naar: " + statusText, "auto", false);
        }

        function initAuto() {
            const statusInput = document.getElementById('autoStatusInput');
            const btnSend = document.getElementById('btnSendAutoStatus');
            const messagesForMe = document.getElementById('messagesForMe');

            // Aanmelden bij start
            db.ref('cars/' + myName).update({
                name: myName,
                status: "Aangemeld",
                lastUpdate: new Date().toLocaleTimeString()
            });

            btnSend.addEventListener('click', () => {
                const msg = statusInput.value.trim();
                if (!msg) return;
                // Dit is een echt bericht, dus WEL laten knipperen bij de centrale (true)
                stuurChatBericht(msg, "auto", true);
                statusInput.value = "";
            });

            // Luisteren naar chatberichten voor deze auto
            db.ref('chats/' + myName).on('value', (snapshot) => {
                const chats = snapshot.val();
                let html = "";
                if (chats) {
                    Object.keys(chats).forEach(key => {
                        const c = chats[key];
                        let stijl = c.sender === 'centrale' ? 'background: #fff3cd; border-left: 4px solid #ffc107;' : 'background: #f0f4f8;';
                        html += `<li style="${stijl}"><strong>${c.senderName} (${c.time}):</strong> ${c.text}</li>`;
                    });
                } else {
                    html = "<li>Nog geen berichten.</li>";
                }
                messagesForMe.innerHTML = html;
            });

            // Luisteren naar algemene broadcast berichten
            db.ref('broadcast').on('value', (snapshot) => {
                const data = snapshot.val();
                if (data) {
                    const li = document.createElement('li');
                    li.style.background = '#e1ecf4';
                    li.innerHTML = `<strong>📢 Centrale Broadcast (${data.time}):</strong> ${data.text}`;
                    messagesForMe.prepend(li);
                }
            });
        }

        function stuurChatBericht(tekst, senderType, triggerKnipperen) {
            const newMsgRef = db.ref('chats/' + myName).push();
            newMsgRef.set({
                sender: senderType,
                senderName: myName,
                text: tekst,
                time: new Date().toLocaleTimeString()
            });

            // Update auto data (triggerKnipperen is true bij een echt bericht, false bij alleen status)
            let updateData = {
                lastUpdate: new Date().toLocaleTimeString()
            };
            if (triggerKnipperen) {
                updateData.hasUnreadMessage = true;
            }

            db.ref('cars/' + myName).update(updateData);
        }

        // --- FUNCTIES VOOR CENTRALE ---
        function initCentrale() {
            const tilesGrid = document.getElementById('tilesGrid');
            const broadcastInput = document.getElementById('broadcastInput');
            const btnSendBroadcast = document.getElementById('btnSendBroadcast');

            // Luisteren naar alle auto's voor tegels
            db.ref('cars').on('value', (snapshot) => {
                const cars = snapshot.val();
                tilesGrid.innerHTML = "";

                if (cars) {
                    Object.keys(cars).forEach(key => {
                        const car = cars[key];
                        const tile = document.createElement('div');
                        
                        // Bepaal de kleur van de tegel op basis van de status
                        let statusClass = "tile-afgemeld";
                        if (car.status === "Aangemeld") statusClass = "tile-aangemeld";
                        else if (car.status === "Bezet") statusClass = "tile-bezet";
                        else if (car.status === "Pauze") statusClass = "tile-pauze";
                        else if (car.status === "Afgemeld") statusClass = "tile-afgemeld";

                        // Knipperen ALLEEN als er een ongelezen bericht is
                        let knipperClass = car.hasUnreadMessage ? "knipperen" : "";
                        tile.className = `car-tile ${statusClass} ${knipperClass}`;

                        tile.innerHTML = `
                            <h4>${car.name}</h4>
                            <p><strong>Status:</strong> ${car.status || 'Onbekend'}</p>
                            <p style="font-size: 11px; opacity: 0.8; margin-top: 4px;">Update: ${car.lastUpdate || '-'}</p>
                        `;

                        tile.addEventListener('click', () => {
                            openModal(car);
                        });

                        tilesGrid.appendChild(tile);
                    });
                } else {
                    tilesGrid.innerHTML = "<p>Geen actieve auto's gevonden.</p>";
                }
            });

            btnSendBroadcast.addEventListener('click', () => {
                const text = broadcastInput.value.trim();
                if (!text) return;

                db.ref('broadcast').set({
                    text: text,
                    time: new Date().toLocaleTimeString()
                });
                broadcastInput.value = "";
                alert("Broadcast verzonden naar iedereen!");
            });
        }

        // Open popup en laad de chatgeschiedenis
        function openModal(car) {
            selectedCarForModal = car.name;
            document.getElementById('modalCarTitle').innerText = "Chat met: " + car.name;
            document.getElementById('modalCarStatus').innerText = car.status || "Onbekend";
            document.getElementById('modalReplyInput').value = "";
            document.getElementById('centralModal').style.display = 'flex';

            // Stop knipperen zodra de tegel wordt geopend
            db.ref('cars/' + car.name).update({ hasUnreadMessage: false });

            // Laad live chatgeschiedenis voor deze auto in de popup
            db.ref('chats/' + car.name).on('value', (snapshot) => {
                const chats = snapshot.val();
                const historyBox = document.getElementById('modalChatHistory');
                let html = "";

                if (chats) {
                    Object.keys(chats).forEach(key => {
                        const c = chats[key];
                        let msgClass = c.sender === 'centrale' ? 'centrale' : 'auto';
                        html += `<div class="chat-msg ${msgClass}"><strong>${c.senderName} (${c.time}):</strong><br>${c.text}</div>`;
                    });
                } else {
                    html = "<p style='color:#777; text-align:center;'>Nog geen berichten gewisseld.</p>";
                }
                historyBox.innerHTML = html;
                historyBox.scrollTop = historyBox.scrollHeight;
            });
        }

        window.closeModal = function() {
            document.getElementById('centralModal').style.display = 'none';
            if (selectedCarForModal) {
                db.ref('chats/' + selectedCarForModal).off();
            }
        }

        // Antwoord sturen vanuit de modal naar de auto (geen knipperen nodig voor centrale-antwoorden)
        window.sendReplyFromModal = function() {
            const text = document.getElementById('modalReplyInput').value.trim();
            if (!text || !selectedCarForModal) return;

            const newMsgRef = db.ref('chats/' + selectedCarForModal).push();
            newMsgRef.set({
                sender: 'centrale',
                senderName: 'Centrale',
                text: text,
                time: new Date().toLocaleTimeString()
            });

            document.getElementById('modalReplyInput').value = "";
        }

        // Status wijzigen vanuit de modal (kleurt direct mee, gaat niet knipperen)
        window.setCarStatusFromModal = function(newStatus) {
            if (!selectedCarForModal) return;

            db.ref('cars/' + selectedCarForModal).update({
                status: newStatus,
                lastUpdate: new Date().toLocaleTimeString()
            });
            document.getElementById('modalCarStatus').innerText = newStatus;
        }

        // Inline Service Worker voor PWA
        if ('serviceWorker' in navigator) {
            const swCode = `
                self.addEventListener('install', (e) => self.skipWaiting());
                self.addEventListener('activate', (e) => self.clients.claim());
                self.addEventListener('fetch', (e) => {
                    e.respondWith(fetch(e.request).catch(() => caches.match(e.request)));
                });
            `;
            const blob = new Blob([swCode], { type: 'text/javascript' });
            const swUrl = URL.createObjectURL(blob);
            navigator.serviceWorker.register(swUrl).catch(err => console.log('SW Fout:', err));
        }
    </script>
</body>
</html>
