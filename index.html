<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Vervoer - Live Ritten</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
</head>
<body>

    <!-- LOGIN SCHEM (Komt eerst als je de app opent) -->
    <div id="login-screen" class="login-overlay">
        <div class="login-box">
            <h2>🚚 Inloggen bij Vervoer</h2>
            <p>Vul je naam of voertuignummer in om te starten:</p>
            <input type="text" id="usernameInput" placeholder="Bijv. Jan of Auto 2">
            <button id="btnLogin">Inloggen & Starten</button>
        </div>
    </div>

    <!-- Desktop Omgeving (Windows Style) -->
    <div id="desktop">
        <!-- Venster 1: Ritten & Status -->
        <div class="window" id="window-data">
            <div class="window-header">
                <span class="title">🚚 Vervoer - Ritten Monitor</span>
                <div class="controls">
                    <button class="btn-min">-</button>
                    <button class="btn-close">×</button>
                </div>
            </div>
            <div class="window-body">
                <h3>Welkom, <span id="currentUserName">-</span></h3>
                
                <div class="input-group">
                    <label for="statusInput">Mijn Rit / Status:</label>
                    <input type="text" id="statusInput" placeholder="Bijv. Onderweg naar klant...">
                </div>

                <div class="input-group">
                    <label for="numberValue">Voortgang / Lading / Km:</label>
                    <input type="number" id="numberValue" placeholder="0">
                </div>

                <hr>

                <!-- CENTRALE WEERGAVE (Vooral handig op de Lenovo M10) -->
                <div class="live-display">
                    <h4>📡 Centrale Overzicht (Wie is waar?)</h4>
                    <ul id="activeUsersList">
                        <!-- Hier verschijnen live alle ingelogde apparaten -->
                        <li>Laden van actieve apparaten...</li>
                    </ul>
                    <p class="sync-indicator">🟢 Realtime verbonden met Centrale</p>
                </div>
            </div>
        </div>

        <!-- Venster 2: GPS & Locatie -->
        <div class="window" id="window-info">
            <div class="window-header">
                <span class="title">📍 GPS & Locatie</span>
                <div class="controls">
                    <button class="btn-min">-</button>
                    <button class="btn-close">×</button>
                </div>
            </div>
            <div class="window-body">
                <h3>GPS Status</h3>
                <p>Breedtegraad: <span id="lat">-</span></p>
                <p>Lengtegraad: <span id="lng">-</span></p>
                <button id="btnGps">📍 Start GPS Tracking</button>
            </div>
        </div>
    </div>

    <!-- Windows Taakbalk -->
    <div id="taskbar">
        <button id="start-btn">🪟 Start</button>
        <div id="open-apps">
            <button class="taskbar-item active" data-window="window-data">🚚 Ritten Monitor</button>
            <button class="taskbar-item active" data-window="window-info">📍 GPS Locatie</button>
        </div>
        <div id="clock">00:00</div>
    </div>

    <!-- Firebase Realtime Database SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
    <script src="app.js"></script>
</body>
</html>
